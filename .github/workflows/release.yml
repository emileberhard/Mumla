name: Release

on:
  push:
    tags: ['**']

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  admit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check that this is the newest version on main
        run: |
          [[ $VERSION =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::$VERSION is not MAJOR.MINOR.PATCH."; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$VERSION is not on main."; exit 1; }
          [[ $(git cat-file -t "refs/tags/$VERSION") == tag ]] || { echo "::error::Release tags must be annotated."; exit 1; }
          newest=$(git tag --list | grep -E '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -1)
          [[ $newest == "$VERSION" ]] || { echo "::error::$newest is newer than $VERSION."; exit 1; }

      - name: Wait for CI to pass on this commit
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started=$SECONDS
          while :; do
            state=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event push --commit "$GITHUB_SHA" --json status,conclusion \
              --jq 'if any(.[]; .conclusion == "success") then "passed" elif any(.[]; .status != "completed") then "running" elif length > 0 then "failed" else "missing" end') \
              || state=unknown
            case $state in
              passed) exit 0 ;;
              failed) echo "::error::CI failed on $GITHUB_SHA."; exit 1 ;;
              missing) (( SECONDS - started < 120 )) || { echo "::error::No CI run exists for $GITHUB_SHA; tag the commit a push to main ended on."; exit 1; } ;;
            esac
            sleep 10
          done

  numbers:
    needs: admit
    runs-on: ubuntu-24.04
    environment: testflight
    timeout-minutes: 10
    outputs:
      ios: ${{ steps.numbers.outputs.ios }}
      mac: ${{ steps.numbers.outputs.mac }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reserve the next two global build numbers
        id: numbers
        env:
          APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          umask 077
          printf '%s' "$APP_STORE_CONNECT_KEY" > "$APP_STORE_CONNECT_KEY_PATH"
          number=$(scripts/app-store-connect next-build-number)
          echo "ios=$number" >> "$GITHUB_OUTPUT"
          echo "mac=$((number + 1))" >> "$GITHUB_OUTPUT"

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  testflight-ios:
    needs: [admit, numbers]
    runs-on: xcode-27
    environment: testflight
    outputs:
      build: ${{ steps.build.outputs.number }}
    timeout-minutes: 80
    permissions:
      actions: read
      contents: read
    env:
      VERSION: ${{ github.ref_name }}
      BUILD_NUMBER: ${{ needs.numbers.outputs.ios }}
      DEVELOPMENT_TEAM: ${{ vars.DEVELOPMENT_TEAM }}
      APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: scripts/select-xcode

      - name: Configure
        env:
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          MUMLA_CLOUDKIT_API_TOKEN: ${{ secrets.MUMLA_CLOUDKIT_API_TOKEN }}
        run: |
          : "${DEVELOPMENT_TEAM:?Set the DEVELOPMENT_TEAM environment variable.}"
          : "${APP_BUNDLE_ID:?Set the APP_BUNDLE_ID environment variable.}"
          : "${MUMLA_CLOUDKIT_API_TOKEN:?Set the MUMLA_CLOUDKIT_API_TOKEN secret.}"
          plutil -insert teamID -string "$DEVELOPMENT_TEAM" Apple/Config/ExportOptions.plist
          umask 077
          printf '%s' "$APP_STORE_CONNECT_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          printf 'MUMLA_CLOUDKIT_API_TOKEN = %s\n' "$MUMLA_CLOUDKIT_API_TOKEN" > Apple/Config/Local.xcconfig

      - name: Check whether an earlier attempt started uploading
        id: fence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fenced=false
          for ((attempt = 1; attempt < GITHUB_RUN_ATTEMPT; attempt++)); do
            started=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$attempt/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name == "testflight-ios") | .steps[] | select(.name == "Upload to TestFlight" and .conclusion != "skipped" and .started_at != null)] | length' | awk '{n += $0} END {print n+0}')
            (( started == 0 )) || fenced=true
          done
          echo "fenced=$fenced" >> "$GITHUB_OUTPUT"

      - name: Select the build number, or the build an earlier attempt uploaded
        id: build
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          FENCED: ${{ steps.fence.outputs.fenced }}
        run: |
          result=$(scripts/app-store-connect build-number IOS "$VERSION" "$([[ $FENCED == true ]] && echo fenced || echo open)")
          read -r number state <<< "$result"
          if [[ $state == new && $number -lt $BUILD_NUMBER ]]; then number=$BUILD_NUMBER; fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "uploaded=$([[ $state == uploaded ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "BUILD_NUMBER=$number" >> "$GITHUB_ENV"

      - name: Fetch the locked packages
        if: steps.build.outputs.uploaded != 'true'
        timeout-minutes: 15
        run: |
          scripts/prepare-packages
          xcodebuild -resolvePackageDependencies -project Mumla.xcodeproj -scheme MumlaiOS -onlyUsePackageVersionsFromResolvedFile

      - name: Archive
        if: steps.build.outputs.uploaded != 'true'
        run: |
          xcodebuild archive -quiet -project Mumla.xcodeproj -scheme MumlaiOS -configuration Release \
            -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/MumlaiOS.xcarchive" \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile -skipPackageUpdates \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO
          scripts/sign-bundles sign "$RUNNER_TEMP/MumlaiOS.xcarchive/Products/Applications/MumlaiOS.app" ios

      - name: Upload the symbols to Sentry
        if: steps.build.outputs.uploaded != 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: mumla
        run: npx --yes @sentry/cli@3.8.2 debug-files upload --include-sources "$RUNNER_TEMP/MumlaiOS.xcarchive/dSYMs"

      - name: Check the entitlements
        if: steps.build.outputs.uploaded != 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          plutil -replace destination -string export -o "$RUNNER_TEMP/check.plist" Apple/Config/ExportOptions.plist
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/MumlaiOS.xcarchive" -exportPath "$RUNNER_TEMP/check" \
            -exportOptionsPlist "$RUNNER_TEMP/check.plist" -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"
          unzip -q "$RUNNER_TEMP/check/MumlaiOS.ipa" -d "$RUNNER_TEMP/check"
          app="$RUNNER_TEMP/check/Payload/MumlaiOS.app"
          scripts/sign-bundles check "$app" ios
          scripts/check-access-configuration "$app/Info.plist"
          plutil -extract CFBundleShortVersionString raw "$app/Info.plist"
          plutil -extract CFBundleVersion raw "$app/Info.plist"

      - name: Wait for the ready access-service release
        if: steps.build.outputs.uploaded != 'true'
        timeout-minutes: 32
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 .github/scripts/wait-for-access-service.py

      - name: Upload to TestFlight
        if: steps.build.outputs.uploaded != 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/MumlaiOS.xcarchive" -exportPath "$RUNNER_TEMP/upload" \
            -exportOptionsPlist Apple/Config/ExportOptions.plist -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8" Apple/Config/Local.xcconfig

  developer-id:
    needs: [admit, numbers]
    runs-on: xcode-27
    environment: testflight
    timeout-minutes: 100
    env:
      VERSION: ${{ github.ref_name }}
      BUILD_NUMBER: ${{ needs.numbers.outputs.mac }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: scripts/select-xcode

      - name: Configure
        env:
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          MUMLA_CLOUDKIT_API_TOKEN: ${{ secrets.MUMLA_CLOUDKIT_API_TOKEN }}
        run: |
          : "${MUMLA_CLOUDKIT_API_TOKEN:?Set the MUMLA_CLOUDKIT_API_TOKEN secret.}"
          umask 077
          printf '%s' "$APP_STORE_CONNECT_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          printf 'MUMLA_CLOUDKIT_API_TOKEN = %s\n' "$MUMLA_CLOUDKIT_API_TOKEN" > Apple/Config/Local.xcconfig
          scripts/prepare-packages

      - name: Install the Developer ID identity
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          DEVELOPER_ID_PROFILE: ${{ secrets.DEVELOPER_ID_PROFILE }}
        run: |
          : "${DEVELOPER_ID_P12:?Set the DEVELOPER_ID_P12 secret.}"
          : "${DEVELOPER_ID_P12_PASSWORD:?Set the DEVELOPER_ID_P12_PASSWORD secret.}"
          : "${DEVELOPER_ID_PROFILE:?Set the DEVELOPER_ID_PROFILE secret.}"
          umask 077
          printf '%s' "$DEVELOPER_ID_PROFILE" | base64 --decode > "$RUNNER_TEMP/developer-id.provisionprofile"
          keychain="$RUNNER_TEMP/developer-id.keychain-db"
          password="$(openssl rand -hex 32)"
          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -f pkcs12 -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"

      - name: Build, notarize and package
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          DEVELOPER_ID_PROFILE: ${{ runner.temp }}/developer-id.provisionprofile
        run: scripts/build-developer-id-dmg.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: developer-id-dmg
          path: dist/Mumla-${{ github.ref_name }}.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Remove credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/developer-id.keychain-db" 2> /dev/null || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/developer-id.provisionprofile" "$RUNNER_TEMP/AuthKey.p8" Apple/Config/Local.xcconfig

  testflight-review:
    needs: testflight-ios
    runs-on: ubuntu-24.04
    environment: testflight
    timeout-minutes: 45
    env:
      VERSION: ${{ github.ref_name }}
      IOS_BUILD: ${{ needs.testflight-ios.outputs.build }}
      APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Wait for the ready access-service release
        timeout-minutes: 32
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 .github/scripts/wait-for-access-service.py

      - name: Set What to Test and submit the iOS build for TestFlight review
        env:
          GH_TOKEN: ${{ github.token }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          umask 077
          printf '%s' "$APP_STORE_CONNECT_KEY" > "$APP_STORE_CONNECT_KEY_PATH"
          tag=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" --jq .object.sha)
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag" --jq .message > "$RUNNER_TEMP/notes.md"
          scripts/app-store-connect testflight IOS "$VERSION" "$IOS_BUILD" "$RUNNER_TEMP/notes.md"

  app-store:
    needs: testflight-ios
    runs-on: xcode-27
    environment: testflight
    timeout-minutes: 60
    env:
      VERSION: ${{ github.ref_name }}
      BUILD_NUMBER: ${{ needs.testflight-ios.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: scripts/select-xcode

      - name: Capture the screenshots
        run: |
          umask 077
          scripts/prepare-packages
          Apple/AppStore/capture

      - name: Wait for the ready access-service release
        timeout-minutes: 32
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 .github/scripts/wait-for-access-service.py

      - name: Prepare the App Store version
        env:
          GH_TOKEN: ${{ github.token }}
          APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          umask 077
          printf '%s' "$APP_STORE_CONNECT_KEY" > "$APP_STORE_CONNECT_KEY_PATH"
          tag=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" --jq .object.sha)
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag" --jq .message > "$RUNNER_TEMP/notes.md"
          scripts/app-store-connect app-store IOS "$VERSION" "$BUILD_NUMBER" .local/screenshots "$RUNNER_TEMP/notes.md"

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  github-release:
    needs: [admit, testflight-ios, developer-id]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: developer-id-dmg
          path: ${{ runner.temp }}/dmg

      - name: Publish the DMG with the tag message as the release notes
        run: |
          tag=$(gh api "repos/$GH_REPO/git/ref/tags/$VERSION" --jq .object.sha)
          gh api "repos/$GH_REPO/git/tags/$tag" --jq .message > "$RUNNER_TEMP/notes.md"
          [[ -s $RUNNER_TEMP/notes.md ]] || { echo "::error::The $VERSION tag has no message to publish."; exit 1; }
          dmg="$RUNNER_TEMP/Mumla.dmg"
          mv "$RUNNER_TEMP/dmg/Mumla-$VERSION.dmg" "$dmg"
          digest="sha256:$(shasum -a 256 "$dmg" | cut -d' ' -f1)"
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" --draft --verify-tag --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md" "$dmg"
          fi
          published=$(gh release view "$VERSION" --json assets --jq '[.assets[] | select(.name == "Mumla.dmg" and .state == "uploaded") | .digest] | first // ""')
          if [[ -z $published ]]; then
            gh release upload "$VERSION" "$dmg" --clobber
          elif [[ $published != "$digest" ]]; then
            echo "::error::$VERSION already publishes a different Mumla.dmg; ship the fix as the next patch."
            exit 1
          fi
          newest=$(gh api --paginate "repos/$GH_REPO/git/matching-refs/tags" --jq '.[].ref | ltrimstr("refs/tags/")' \
            | grep -E '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -1)
          latest=(--latest)
          [[ $VERSION == "$newest" ]] || latest=(--latest=false)
          gh release edit "$VERSION" --draft=false "${latest[@]}"
